# LTempGuard Configuration File
# Temperature thresholds are specified in degrees Celsius (floating-point format supported)

# Threshold at or above which state enters WARNING (Default: 40.0 C)
warning_threshold=40.0

# Threshold at or above which state enters CRITICAL (Default: 60.0 C)
critical_threshold=60.0

# Sensor polling interval in milliseconds (Default: 1000 ms)
poll_interval_ms=1000

# Device path in character device filesystem
device_path=/dev/temp_sensor

# Path to log file
log_file=logs/ltempguard.log

# Path to CSV event log
csv_log_file=logs/ltempguard_events.csv
